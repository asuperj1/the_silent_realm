<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <!-- 羊皮纸纹理 -->
    <filter id="parchment">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feColorMatrix type="matrix" in="noise" result="color"
        values="0 0 0 0 0.82
                0 0 0 0 0.70
                0 0 0 0 0.45
                0 0 0 0.18 0"/>
      <feBlend in="SourceGraphic" in2="color" mode="multiply"/>
    </filter>
    <!-- 墨水笔触 -->
    <filter id="ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 羊皮纸底色 -->
  <rect width="600" height="400" fill="#d4c098" filter="url(#parchment)"/>
  <rect width="600" height="400" fill="url(#parchment)" opacity="0.3"/>

  <!-- 边框装饰 -->
  <rect x="8" y="8" width="584" height="384" fill="none" stroke="#5a4020" stroke-width="2.5" opacity="0.6" filter="url(#ink)"/>
  <rect x="12" y="12" width="576" height="376" fill="none" stroke="#5a4020" stroke-width="0.8" opacity="0.35"/>

  <!-- 主道路网格 -->
  <g stroke="#5a3820" stroke-width="1.8" opacity="0.55" filter="url(#ink)" fill="none">
    <!-- 水平主路 -->
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="310" x2="600" y2="310"/>
    <!-- 垂直主路 -->
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="140" y1="0" x2="140" y2="400"/>
    <line x1="460" y1="0" x2="460" y2="400"/>
  </g>

  <!-- 次要小巷 -->
  <g stroke="#6b4a2e" stroke-width="0.8" opacity="0.35" fill="none" stroke-dasharray="4,3">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="70" y1="0" x2="70" y2="400"/>
    <line x1="220" y1="0" x2="220" y2="400"/>
    <line x1="380" y1="0" x2="380" y2="400"/>
    <line x1="530" y1="0" x2="530" y2="400"/>
  </g>

  <!-- 建筑区块（半透明色块） -->
  <g opacity="0.18">
    <rect x="20" y="20" width="110" height="90" fill="#5a4020" rx="1"/>
    <rect x="160" y="20" width="130" height="90" fill="#6b4a2e" rx="1"/>
    <rect x="310" y="20" width="140" height="90" fill="#5a4020" rx="1"/>
    <rect x="470" y="20" width="110" height="90" fill="#6b4a2e" rx="1"/>

    <rect x="20" y="130" width="110" height="60" fill="#6b4a2e" rx="1"/>
    <rect x="310" y="130" width="140" height="60" fill="#6b4a2e" rx="1"/>
    <rect x="470" y="130" width="110" height="60" fill="#5a4020" rx="1"/>

    <rect x="20" y="210" width="110" height="90" fill="#5a4020" rx="1"/>
    <rect x="160" y="210" width="130" height="40" fill="#6b4a2e" rx="1"/>
    <rect x="310" y="210" width="140" height="90" fill="#5a4020" rx="1"/>
    <rect x="470" y="210" width="110" height="90" fill="#6b4a2e" rx="1"/>

    <rect x="20" y="320" width="110" height="60" fill="#6b4a2e" rx="1"/>
    <rect x="160" y="270" width="130" height="110" fill="#5a4020" rx="1"/>
    <rect x="310" y="320" width="140" height="60" fill="#6b4a2e" rx="1"/>
    <rect x="470" y="320" width="110" height="60" fill="#5a4020" rx="1"/>
  </g>

  <!-- 地标图标 -->
  <g font-size="12" fill="#3a2010" text-anchor="middle" font-family="serif" opacity="0.7">
    <!-- 教堂 -->
    <text x="140" y="215">✝</text>
    <!-- 图书馆 -->
    <text x="300" y="155">📚</text>
    <!-- 码头 -->
    <text x="530" y="375">⚓</text>
    <!-- 森林 -->
    <text x="70" y="60">🌲</text>
    <!-- 庄园 -->
    <text x="460" y="75">🏛</text>
    <!-- 集市 -->
    <text x="380" y="275">🏪</text>
    <!-- 墓园 -->
    <text x="240" y="375">🪦</text>
    <!-- 地下入口 -->
    <text x="380" y="380">⬇</text>
    <!-- 海岸 -->
    <text x="530" y="185">🌊</text>
  </g>

  <!-- 地图标题 -->
  <g font-size="10" fill="#3a2010" font-family="serif" opacity="0.5">
    <text x="300" y="395" text-anchor="middle" letter-spacing="4">ARKHAM · 1925</text>
  </g>
</svg>
