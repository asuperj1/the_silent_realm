<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寂静之地</title>
  <link rel="stylesheet" href="css/coverPage.css">
</head>
<body>

  <!-- 尘埃粒子容器 -->
  <canvas id="dustCanvas"></canvas>

  <!-- 静音开关 -->
  <button id="btnMute" class="mute-toggle" title="静音/取消静音">
    <span class="mute-icon">🔊</span>
  </button>

  <!-- 扉页主体 -->
  <div id="coverContainer" class="cover-container">
    <!-- 鎏金外框 -->
    <div class="golden-frame">
      <div class="frame-corner tl"></div>
      <div class="frame-corner tr"></div>
      <div class="frame-corner bl"></div>
      <div class="frame-corner br"></div>
      <div class="frame-edge top"></div>
      <div class="frame-edge bottom"></div>
      <div class="frame-edge left"></div>
      <div class="frame-edge right"></div>

      <!-- 内框光扫 -->
      <div class="frame-sweep"></div>

      <!-- 内容区：图片区 + 文字区纵向排列 -->
      <div class="cover-content">
        <!-- 图片区：洛夫克拉夫特图贴边填充金框上部 -->
        <div class="cover-image-area">
          <img
            class="cover-quote-img"
            id="coverQuoteImg"
            src="/assets/洛夫克拉夫特名言黑金边框图.png"
            alt="洛夫克拉夫特名言"
            draggable="false"
          />
          <!-- 图片底部到黑色文字区的过渡融合层 -->
          <div class="cover-image-fade"></div>
        </div>

        <!-- 文字区：金框内部下方黑色留白区域 -->
        <div class="cover-text-area">
          <div class="cover-text-overlay">
            <p class="cover-eng-quote">"In his house at R'lyeh, dead Cthulhu waits dreaming."</p>
            <h1 class="cover-title">寂静之地</h1>
            <p class="cover-subtitle">Call of Cthulhu · 轮回</p>
            <p class="cover-hint" id="coverHint">— 点击任意位置进入寂静之地 —</p>
            <p class="cover-countdown" id="coverCountdown"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 音频元素 -->
  <audio id="ambientAudio" loop preload="auto">
    <!-- 占位音频：用户可将雨声+深海嗡鸣放入 /public/assets/audio/ambient.mp3 -->
    <source src="assets/audio/ambient.mp3" type="audio/mpeg">
  </audio>

  <script src="js/coverAnim.js"></script>
</body>
</html>
